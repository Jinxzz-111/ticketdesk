<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicketDesk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>TicketDesk</h1>
    <p>Send a request and follow it until it is resolved.</p>
    <button id="theme" type="button">Dark mode</button>
  </header>
  <main>
    <form id="form">
      <h2>New request</h2>
      <label>Title <input id="title" required minlength="3"></label>
      <label>Details <textarea id="description" rows="3"></textarea></label>
      <label>Your name <input id="requester"></label>
      <label>Priority
        <select id="priority"><option>low</option><option selected>medium</option><option>high</option></select>
      </label>
      <button>Submit request</button>
      <p id="msg" role="status"></p>
    </form>
    
    <section>
      <h2>Requests</h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search by title" aria-label="Search requests">
        <select id="filter" aria-label="Filter by priority">
          <option value="all">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="sort" aria-label="Sort requests">
          <option value="newest">Newest first</option>
          <option value="priority">Highest priority first</option>
        </select>
      </div>
      <ul id="list"></ul>
    </section>
  </main>
  <dialog id="confirm">
    <h2>Delete this request?</h2>
    <p class="confirm-text" id="confirm-text"></p>
    <p>This permanently removes it from the history.</p>
    <p id="confirm-error" role="alert"></p>
    <div class="confirm-actions">
      <button type="button" id="confirm-no" class="btn-reopen">No</button>
      <button type="button" id="confirm-yes">Yes, delete</button>
    </div>
  </dialog>
  <footer>Build <span id="build"></span></footer>
  <script src="version.js"></script>
  <script src="app.js"></script>
</body>
</html>
